<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 E · 行星轨道（演示页原版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0d12;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e2d8;overflow:hidden;}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0d12;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e2d8;overflow:hidden;}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:rgba(20,22,30,.85);border:1px solid rgba(203,184,157,.25);border-radius:999px;padding:9px 22px;font-size:13px;color:#cbb89d;letter-spacing:1px;z-index:50;backdrop-filter:blur(6px);}
.hint b{color:#e6d5b8;}
/* 方案容器 */
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;}
.scene.active{display:flex;}
.scene .tag{position:absolute;top:26px;left:34px;font-size:12px;letter-spacing:3px;color:rgba(203,184,157,.55);z-index:10;}
.scene .tag b{display:block;font-size:15px;color:#cbb89d;letter-spacing:2px;margin-bottom:4px;}
/* 通用 logo 尺寸 */
.logo{width:min(520px,72vw);}
.logo svg{display:block;width:100%;height:auto;}
/* A 水印浮雕 */
.a-bg{position:absolute;inset:0;}
.a-bg::before{content:'';position:absolute;width:900px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);opacity:.06;filter:blur(1px);}
.scene-a .a-mark{position:absolute;width:900px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);opacity:.07;pointer-events:none;}
.scene-a .a-mark svg{width:100%;height:auto;}
.scene-a .center-logo{position:relative;z-index:2;opacity:.95;filter:drop-shadow(0 0 30px rgba(203,184,157,.25));}
/* B 霓虹发光 */
.scene-b .logo{filter:drop-shadow(0 0 12px rgba(203,184,157,.55)) drop-shadow(0 0 34px rgba(203,184,157,.35)) drop-shadow(0 0 70px rgba(203,184,157,.2));animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.92;filter:drop-shadow(0 0 12px rgba(203,184,157,.5)) drop-shadow(0 0 30px rgba(203,184,157,.3));}50%{opacity:1;filter:drop-shadow(0 0 18px rgba(203,184,157,.75)) drop-shadow(0 0 46px rgba(203,184,157,.45));}}
.scene-b .ring{position:absolute;width:680px;height:680px;border-radius:50%;border:1px solid rgba(203,184,157,.14);animation:spin 26s linear infinite;}
.scene-b .ring2{width:540px;height:540px;border:1px dashed rgba(203,184,157,.18);animation:spin 18s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
/* C 粒子星云 */
.scene-c .logo{position:relative;z-index:2;filter:drop-shadow(0 0 16px rgba(203,184,157,.4));}
.particles{position:absolute;inset:0;overflow:hidden;}
.particles i{position:absolute;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#e6d5b8,rgba(203,184,157,0));box-shadow:0 0 8px rgba(203,184,157,.8);animation:float linear infinite;opacity:0;}
@keyframes float{0%{transform:translateY(0) scale(.6);opacity:0;}12%{opacity:.9;}88%{opacity:.7;}100%{transform:translateY(-130px) scale(1.1);opacity:0;}}
.scene-c .glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(203,184,157,.14),transparent 65%);filter:blur(10px);}
/* D 光束汇聚 */
.scene-d .beams{position:absolute;inset:0;}
.beam{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(203,184,157,.5),transparent);filter:blur(1px);animation:beamMove 7s ease-in-out infinite;}
@keyframes beamMove{0%,100%{opacity:.15;transform:scaleX(.6);}50%{opacity:.7;transform:scaleX(1.15);}}
.scene-d .logo{position:relative;z-index:2;filter:drop-shadow(0 0 22px rgba(203,184,157,.5));}
/* E 行星轨道（圆圈轨道 + 方块行星 + Logo 侧置） */
.scene-e .logo{position:absolute;right:8%;bottom:10%;width:min(340px,40vw);filter:drop-shadow(0 0 12px rgba(203,184,157,.5)) drop-shadow(0 0 36px rgba(203,184,157,.28));}
.orbit{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border:1px solid rgba(203,184,157,.22);border-radius:50%;animation:spin 18s linear infinite;}
.orbit2{width:560px;height:560px;margin:-280px 0 0 -280px;border:1px dashed rgba(203,184,157,.15);animation:spin 26s linear infinite reverse;}
.orbit3{width:980px;height:980px;margin:-490px 0 0 -490px;border:1px solid rgba(203,184,157,.1);animation:spin 36s linear infinite;}
.orbit .planet,.orbit2 .planet,.orbit3 .planet{position:absolute;transform:rotate(45deg);}
.orbit .planet{top:-13px;left:50%;width:26px;height:26px;margin-left:-13px;background:linear-gradient(135deg,#e6d5b8,#cbb89d);border-radius:6px;box-shadow:0 0 22px rgba(203,184,157,.95);}
.orbit2 .planet{bottom:-9px;left:16%;width:16px;height:16px;background:#cbb89d;border-radius:4px;box-shadow:0 0 14px rgba(203,184,157,.8);}
.orbit3 .planet{top:50%;right:-8px;width:12px;height:12px;background:#8f7a5f;border-radius:3px;box-shadow:0 0 10px rgba(203,184,157,.7);}
/* 导航 */
.nav{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:50;}
.nav button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(203,184,157,.25);background:rgba(16,18,26,.8);color:#cbb89d;font-size:13px;cursor:pointer;transition:.25s;backdrop-filter:blur(4px);}
.nav button:hover,.nav button.on{border-color:#cbb89d;background:rgba(203,184,157,.12);}

</style>
</head>
