<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Rill — Contact Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231c3d5a'/%3E%3Ctext x='12' y='17' font-size='13' fill='%23cbb89d' text-anchor='middle' font-family='Georgia,serif'%3EGR%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --paper:#ffffff;
    --ink:#1c3d5a;
    --gray:#8a8f98;
    --line:rgba(203,184,157,.5);
    --panel:rgba(255,255,255,.78);
    --accent:#1c3d5a;
    --city:#cbb89d;
    --land:rgba(28,61,90,.78);
    --sea:rgba(28,61,90,.12);
    --card-shadow:0 24px 64px rgba(28,61,90,.12);
  }
  [data-theme="dark"]{
    --paper:#0f1c30;
    --ink:#f2ead9;
    --gray:#a9b4c4;
    --line:rgba(203,184,157,.35);
    --panel:rgba(22,42,71,.78);
    --accent:#cbb89d;
    --city:#cbb89d;
    --land:rgba(203,184,157,.6);
    --sea:rgba(203,184,157,.13);
    --card-shadow:0 24px 64px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
    background:var(--paper);color:var(--ink);
    overflow:hidden;
    transition:background .5s,color .5s;
  }
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;}

  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 48px;
  }
  .brand{
    font-size:17px;letter-spacing:3px;font-weight:600;color:var(--ink);
  }
  .brand small{font-weight:300;font-size:11px;letter-spacing:2px;color:var(--gray);margin-left:8px;}
  .theme-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    transition:border-color .3s,color .3s,transform .3s;
  }
  .theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:rotate(18deg);}
  .theme-btn svg{width:15px;height:15px;}

  .card{
    position:fixed;z-index:10;left:7%;top:50%;transform:translateY(-50%);
    max-width:400px;padding:44px 46px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--card-shadow);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:background .5s,border-color .5s;
  }
  .card .kicker{
    font-size:11px;letter-spacing:4px;color:var(--gray);
    text-transform:uppercase;margin-bottom:12px;
  }
  .card h1{
    font-size:30px;font-weight:600;letter-spacing:2px;margin-bottom:30px;
  }
  .card dl{display:grid;grid-template-columns:88px 1fr;gap:14px 18px;}
  .card dt{font-size:13px;color:var(--gray);letter-spacing:1px;line-height:1.6;}
  .card dd{font-size:14px;letter-spacing:.5px;line-height:1.6;color:var(--ink);font-weight:500;}
  .card .sg{
    margin-top:28px;padding-top:22px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:88px 1fr;gap:10px 18px;
  }
  .card .sg b{font-size:13px;color:var(--gray);font-weight:400;letter-spacing:1px;}
  .card .sg span{font-size:14px;letter-spacing:.5px;font-weight:500;}
  .card .note{
    margin-top:26px;font-size:11px;letter-spacing:1px;color:var(--gray);
    line-height:1.8;
  }

  .legend{
    position:fixed;z-index:10;right:48px;bottom:36px;
    font-size:11px;letter-spacing:2px;color:var(--gray);
    display:flex;align-items:center;gap:10px;
  }
  .legend i{
    width:7px;height:7px;border-radius:50%;display:inline-block;
    background:var(--city);box-shadow:0 0 8px var(--city);
  }

  @media (max-width:820px){
    header{padding:20px 24px;}
    .card{left:24px;right:24px;max-width:none;padding:34px 30px;}
    .card h1{font-size:26px;}
    .legend{right:24px;bottom:22px;}
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<header>
  <div class="brand">GOLDEN RILL<small>GR</small></div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>
  </button>
</header>

<div class="card">
  <p class="kicker">Contact Us</p>
  <h1>联系我们</h1>
  <dl>
    <div><dt>公司名称</dt><dd>Golden Rill Prime Future</dd></div>
    <div><dt>办公地址</dt><dd>待补充</dd></div>
    <div><dt>联系电话</dt><dd>待补充</dd></div>
    <div><dt>电子邮箱</dt><dd>待补充</dd></div>
    <div><dt>官方网站</dt><dd>待补充</dd></div>
  </dl>
  <div class="sg">
    <b>新加坡总部</b>
    <span>地址：待补充</span>
  </div>
  <p class="note">PRIVATE FUND · QUALIFIED INVESTORS ONLY</p>
</div>

<div class="legend"><i></i> Beijing · Singapore</div>

<script>
/* ===== 点阵世界地图数据：[row, x1,x2, x3,x4, ...] 每行陆地列区间 ===== */
var GRID = [[3,49,57,67,78],[4,42,43,45,55,57,82,136,138],[5,34,34,37,39,43,45,47,51,55,79,96,100,138,141],[6,29,31,41,42,45,50,54,80,97,98,123,123,140,142],[7,34,34,40,42,44,49,61,79,118,119,133,145,159,161,163,164],[8,27,32,36,36,39,40,42,43,45,48,50,51,62,78,116,117,124,125,127,127,130,153],[9,0,0,10,13,31,37,42,43,45,53,64,76,78,78,102,104,117,118,123,125,127,154,156,168,179,179],[10,7,31,33,35,38,38,41,41,43,45,47,48,51,55,64,76,99,108,120,122,124,125,127,179],[11,0,1,3,3,8,48,53,58,63,72,97,110,112,112,114,125,127,179],[12,2,3,7,45,47,47,51,56,64,69,78,82,95,100,102,106,108,108,110,179],[13,8,44,48,48,54,55,57,57,65,68,93,98,101,179],[14,7,42,51,54,66,68,92,98,101,167,172,175],[15,9,12,21,42,51,55,57,57,93,98,102,160,170,170],[16,10,11,23,44,52,58,87,88,94,94,96,98,101,158,168,171],[17,8,8,25,48,50,60,86,88,94,94,100,157,168,170],[18,25,48,51,61,85,86,88,89,92,161,168,168],[19,26,59,61,61,88,89,91,159,161,161],[20,27,57,61,62,89,159],[21,28,57,89,114,116,158,161,161],[22,28,58,89,95,97,104,107,107,109,112,116,157],[23,28,54,85,91,94,96,99,103,111,113,116,156,160,161],[24,28,53,86,89,94,94,97,98,100,114,117,154,160,160],[25,28,52,85,89,98,98,100,100,103,113,117,148,150,150,152,153,160,160],[26,29,51,85,85,87,88,93,95,97,97,104,114,117,150,153,154,158,159],[27,30,51,87,94,106,106,108,149,153,153,156,159],[28,31,49,85,96,107,149,155,156],[29,32,48,85,98,100,150],[30,34,41,48,49,84,113,115,150],[31,33,33,35,40,49,49,83,106,108,114,117,149],[32,34,34,36,40,82,106,108,115,117,117,123,148,150,150],[33,37,40,48,49,82,107,109,119,125,147,150,150],[34,37,40,45,46,51,51,81,107,110,118,125,133,136,143],[35,38,41,44,45,54,55,82,108,111,118,126,131,137,142,144,144],[36,40,45,82,108,111,116,127,130,137,143,150,150],[37,44,47,81,109,111,114,127,129,139,143,150,150],[38,46,47,81,110,112,112,127,129,139,144,150,150],[39,47,47,52,55,59,59,82,111,113,115,128,129,139,139,142,143,151,152],[40,48,50,52,59,83,114,128,128,130,130,139,139,142,142,152,152],[41,51,60,84,114,130,130,140,140,148,148,152,152],[42,51,63,85,86,88,88,93,113,138,138,140,141,147,148],[43,51,64,95,112,139,139,141,141,146,148],[44,50,64,95,111,139,140,144,148,150,151],[45,49,66,94,110,140,141,145,148,155,156],[46,50,69,95,109,141,142,145,147,149,150,153,154,156,160],[47,49,71,96,109,142,142,151,151,159,162,165,165],[48,50,72,96,109,143,145,159,163,168,168],[49,51,71,96,109,148,148,152,152,160,161,163,164,170,170],[50,51,70,97,109],[51,52,70,96,109,114,114,155,157,161,161],[52,52,70,96,109,113,114,152,157,161,162,173,173],[53,54,69,96,108,112,114,151,162],[54,55,69,96,107,112,114,151,162],[55,55,69,97,106,112,113,148,164,172,172],[56,55,67,97,107,112,113,147,164],[57,55,65,97,106,112,112,147,165],[58,54,65,98,105,147,166],[59,54,64,98,105,147,166],[60,54,64,99,104,148,166],[61,54,63,99,103,148,151,157,165],[62,54,60,148,148,158,164,176,176],[63,53,61,160,164,177,177],[64,53,58,177,178],[65,53,56,58,58,162,163,176,177],[66,53,57,163,163,175,175],[67,53,56,173,175],[68,53,56],[69,52,55,124,124],[70,52,54],[71,53,55],[72,54,55],[77,58,58],[78,56,57,114,118,133,134,137,137,140,148,150,162],[79,54,54,56,57,106,107,110,124,129,167],[80,53,58,86,86,91,123,126,173],[81,38,40,45,46,55,59,82,174],[82,19,38,40,57,81,171],[83,15,51,75,171],[84,9,9,12,50,65,67,72,171],[85,11,13,15,54,72,169],[86,13,172],[87,9,17]];

var COLS = 180, ROWS = 81;
var CITIES = [
  { name:'北京', en:'Beijing',   r:22, c:148 },
  { name:'新加坡', en:'Singapore', r:39, c:141 }
];

var canvas = document.getElementById('map');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, step = 0, dpr = 1;
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function theme(){
  var cs = getComputedStyle(document.documentElement);
  return {
    land: cs.getPropertyValue('--land').trim(),
    sea:  cs.getPropertyValue('--sea').trim(),
    ink:  cs.getPropertyValue('--ink').trim(),
    gray: cs.getPropertyValue('--gray').trim(),
    accent: cs.getPropertyValue('--accent').trim(),
    city: cs.getPropertyValue('--city').trim(),
    line: cs.getPropertyValue('--line').trim()
  };
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  step = W / COLS;
  draw(0);
}

function gridXY(r, c){ return { x:(c+0.5)*step, y:(r+0.5)*H/ROWS }; }

function draw(t){
  var th = theme();
  ctx.clearRect(0,0,W,H);

  /* 海洋点（全网格浅点） */
  var rStep = H / ROWS;
  var pr = Math.max(step*0.16, 1.1);
  ctx.fillStyle = th.sea;
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      ctx.beginPath();
      ctx.arc((c+0.5)*step, (r+0.5)*rStep, pr, 0, 6.2832);
      ctx.fill();
    }
  }

  /* 陆地点（覆盖） */
  ctx.fillStyle = th.land;
  for(var i=0;i<GRID.length;i++){
    var row = GRID[i], r = row[0];
    for(var j=1;j<row.length;j+=2){
      var x1 = row[j], x2 = row[j+1];
      for(var c=x1;c<=x2;c++){
        ctx.beginPath();
        ctx.arc((c+0.5)*step, (r+0.5)*rStep, pr, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  /* 城市连线：大圆弧 */
  var A = gridXY(CITIES[0].r, CITIES[0].c);
  var B = gridXY(CITIES[1].r, CITIES[1].c);
  var mx = (A.x+B.x)/2, my = (A.y+B.y)/2 - (Math.abs(B.x-A.x)*0.22);
  ctx.strokeStyle = th.line;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([2,6]);
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.quadraticCurveTo(mx, my, B.x, B.y);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 城市发光点 */
  var pulse = reduced ? 1 : 0.5 + 0.5*Math.sin(t*0.002);
  for(var k=0;k<CITIES.length;k++){
    var P = gridXY(CITIES[k].r, CITIES[k].c);
    var R = step*2.6 + pulse*step*0.7;
    var g = ctx.createRadialGradient(P.x,P.y,0, P.x,P.y,R);
    g.addColorStop(0, 'rgba(203,184,157,.85)');
    g.addColorStop(0.4, 'rgba(203,184,157,.25)');
    g.addColorStop(1, 'rgba(203,184,157,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(P.x,P.y,R,0,6.2832); ctx.fill();

    ctx.fillStyle = th.accent;
    ctx.beginPath(); ctx.arc(P.x,P.y,3.2,0,6.2832); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(P.x,P.y,1.6,0,6.2832); ctx.fill();

    /* 标签 */
    var label = CITIES[k].name + '  ' + CITIES[k].en;
    ctx.font = '500 12px "Noto Serif SC", Georgia, serif';
    ctx.fillStyle = th.ink;
    ctx.textAlign = 'center';
    ctx.fillText(label, P.x, P.y - step*1.6);
  }
}

function loop(t){
  draw(t);
  if(!reduced) requestAnimationFrame(loop);
}

function toggleTheme(){
  var el = document.documentElement;
  var dark = el.getAttribute('data-theme') === 'dark';
  el.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('iconSun').style.display = dark ? 'inline' : 'none';
  document.getElementById('iconMoon').style.display = dark ? 'none' : 'inline';
  try{ localStorage.setItem('grpf-preview-theme', dark ? 'light' : 'dark'); }catch(e){}
}

/* 初始化 */
try{
  var savedTheme = localStorage.getItem('grpf-preview-theme');
  if(savedTheme === 'dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('iconSun').style.display = 'none';
    document.getElementById('iconMoon').style.display = 'inline';
  }
}catch(e){}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
